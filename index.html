<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GPL Stays — Direct Booking & Inquiries</title>
  <meta name="description" content="Direct booking for GPL Stays vacation rentals in Lee County, FL. Real estate and long-term rental inquiries welcome." />
  <style>
    :root { --bg:#0f1419; --fg:#eef2f7; --accent:#d4a85a; --muted:#9aa4b2; --line:#26303a; --err:#e57373; }
    *,*::before,*::after { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--fg); line-height:1.5; }
    .wrap { max-width: 640px; margin: 0 auto; padding: 48px 20px 80px; }
    h1 { font-weight: 600; letter-spacing:-0.02em; margin: 0 0 8px; font-size: clamp(28px, 5vw, 40px); }
    .sub { color: var(--muted); margin: 0 0 32px; }
    form { display: grid; gap: 16px; }
    label { display: grid; gap: 6px; font-size: 14px; color: var(--muted); }
    input, select, textarea { font: inherit; color: var(--fg); background: #182028; border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; width: 100%; }
    input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }
    textarea { min-height: 120px; resize: vertical; }
    button { background: var(--accent); color: #18130a; border: 0; border-radius: 8px; padding: 14px 18px; font: inherit; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: 0.6; cursor: progress; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 520px) { .row { grid-template-columns: 1fr; } }
    .msg { padding: 12px 14px; border-radius: 8px; font-size: 14px; }
    .msg.ok { background: #1d3a26; color: #b6e2c1; }
    .msg.err { background: #3a1d1d; color: #f4b8b8; }
    .hp { position: absolute; left: -9999px; width: 1px; height: 1px; }
    footer { color: var(--muted); margin-top: 48px; font-size: 13px; text-align: center; }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>GPL Stays</h1>
    <p class="sub">Direct booking, real estate inquiries, and long-term rentals in Lee County, FL.</p>

    <form id="lead-form" novalidate>
      <div class="row">
        <label>Name
          <input name="name" required maxlength="120" autocomplete="name" />
        </label>
        <label>Phone
          <input name="phone" type="tel" maxlength="40" autocomplete="tel" />
        </label>
      </div>
      <label>Email
        <input name="email" type="email" required maxlength="200" autocomplete="email" />
      </label>
      <label>Inquiry type
        <select name="lead_type">
          <option value="guest_booking">Direct booking — short stay</option>
          <option value="real_estate">Real estate (buy / sell / manage)</option>
          <option value="long_term_rental">Long-term rental</option>
          <option value="other">Other</option>
        </select>
      </label>
      <label>Message
        <textarea name="message" maxlength="2000" placeholder="Dates, property, questions, anything we should know"></textarea>
      </label>
      <input class="hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true" />
      <div id="turnstile-mount"></div>
      <button type="submit" id="submit-btn">Send inquiry</button>
      <div id="form-msg" class="msg" style="display:none"></div>
    </form>

    <footer>© GPL Stays · Lee County, FL</footer>
  </main>

  <script>
    const API_URL = "https://api.gplstays.com/webhook/lead";
    const TURNSTILE_SITEKEY = "";

    if (TURNSTILE_SITEKEY) {
      const s = document.createElement("script");
      s.src = "https://challenges.cloudflare.com/turnstile/v0/api.js";
      s.async = true;
      document.head.appendChild(s);
      window.onloadTurnstileCallback = () => {
        window.turnstile.render("#turnstile-mount", { sitekey: TURNSTILE_SITEKEY });
      };
    }

    const form = document.getElementById("lead-form");
    const btn = document.getElementById("submit-btn");
    const msg = document.getElementById("form-msg");

    function show(kind, text) {
      msg.className = "msg " + kind;
      msg.textContent = text;
      msg.style.display = "block";
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      msg.style.display = "none";
      const fd = new FormData(form);
      if (fd.get("website")) return;

      const payload = {
        name: (fd.get("name") || "").trim(),
        email: (fd.get("email") || "").trim(),
        phone: (fd.get("phone") || "").trim(),
        message: (fd.get("message") || "").trim(),
        lead_type: fd.get("lead_type") || "guest_booking",
        source_url: window.location.href,
        turnstile_token: (document.querySelector("[name='cf-turnstile-response']") || {}).value || "",
      };
      if (!payload.name || !payload.email) {
        show("err", "Name and email are required.");
        return;
      }

      btn.disabled = true;
      try {
        const r = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        if (r.ok) {
          form.reset();
          show("ok", "Thanks — we got it. Check your email for a confirmation.");
        } else {
          const err = await r.json().catch(() => ({ detail: "Submission failed." }));
          show("err", err.detail || "Submission failed. Please try again.");
        }
      } catch (err) {
        show("err", "Network error. Please try again.");
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
